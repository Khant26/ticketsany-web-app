# .render.yaml
services:
  - type: web
    name: ticket-anywhere-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn ticketanywhere.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ticketsany.com
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-anywhere-db
          property: connectionString

databases:
  - name: ticket-anywhere-db
    plan: free
    region: ohio
